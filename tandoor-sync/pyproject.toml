[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kptncook-tandoor-sync"
version = "0.1.0"
description = "One-way KptnCook favorites importer for Tandoor"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "kptncook",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
kptncook-tandoor-sync = "kptncook_tandoor_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

