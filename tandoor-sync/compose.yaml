services:
  sync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KPTNCOOK_VERSION: ${KPTNCOOK_VERSION:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KPTNCOOK_HOME: /data
      STATE_PATH: /data/history.sqlite3
    volumes:
      - sync-state:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 150s

volumes:
  sync-state:
