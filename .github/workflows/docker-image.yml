name: Build and publish image

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest stable kptncook release
        id: kptncook
        run: |
          version="$(curl -fsSL https://pypi.org/pypi/kptncook/json | python3 -c '
          import json, sys
          from pip._vendor.packaging.version import InvalidVersion, Version
          stable = []
          for raw, files in json.load(sys.stdin)["releases"].items():
              try:
                  v = Version(raw)
              except InvalidVersion:
                  continue
              if files and not v.is_prerelease and not v.is_devrelease and not all(f.get("yanked", False) for f in files):
                  stable.append(v)
          if not stable:
              raise SystemExit("no stable kptncook release found")
          print(max(stable))
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=kptncook-${{ steps.kptncook.outputs.version }},enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tandoor-sync
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          build-args: KPTNCOOK_VERSION=${{ steps.kptncook.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
